name: Novocall
description: >-
  Novocall was a Singapore-based callback and lead-conversion SaaS (a click-to-call and callback-scheduling
  widget that turned website visitors into inbound phone calls and booked meetings), surfaced as a 500 Global
  portfolio company and added to the API Evangelist network as a stub for enrichment. It was acquired by
  Malaysian commerce platform EasyStore in March 2023, alongside sibling product NovoChat, and has been
  marketed since as "Novocall, an EasyStore company". As of the August 2026 enrichment pass every Novocall
  host is dead: the apex novocall.co keeps live email DNS (Google Workspace MX, SPF, DMARC quarantine, CAA)
  but has no A record at all, www.novocall.co, app.novocall.co and call.novocall.co — the widget/dashboard
  host hardcoded in Novocall's own WordPress plugin — all return a Cloudflare 530 (edge up, origin gone),
  help.novocall.co returns 429 with Cloudflare error 1027 (account daily request limit reached),
  getnovocall.com times out, and novocall.com is now an Afternic parked domain whose catch-all answers 200
  with an HTML lander for every path including /openapi.json and /.well-known/agent-card.json. No API,
  specification, developer portal, .well-known document or documentation surface exists on any reachable
  host. The only first-party artifact Novocall ever published that survives is a WordPress callback-widget
  plugin, stuck at version 1.0.0 since 2019-04-08.
