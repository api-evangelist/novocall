name: Novocall
description: >-
  Novocall was a Singapore-based callback and lead-conversion SaaS (a click-to-call and callback-scheduling
  widget that turned website visitors into inbound phone calls and booked meetings), surfaced as a 500 Global
  portfolio company and added to the API Evangelist network as a stub for enrichment. As of the July 2026
  enrichment pass the company's public web presence is unreachable. The apex novocall.co has live email DNS
  (SPF, DMARC quarantine, CAA) but no web host, www.novocall.co returns a Cloudflare 530 (origin down),
  novocall.com is a parked/for-sale domain, and getnovocall.com refuses connections. No public API, developer
  portal, or documentation surface could be reached, so no API artifacts were harvested; only a live
  domain-security probe of the remaining DNS/TLS footprint was captured.
